<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperMensch online (dev)</title>
<style>
  :root { --bg: #f6f4ef; --card: #fff; --ink: #222; --muted: #777; --line: #ddd; --accent: #2b6cb0; }
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fafafa; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  input, select { font: inherit; padding: 3px 6px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .opts button { display: block; width: 100%; text-align: start; margin: 4px 0; }
  .err { color: #b00; }
  code { background: #eee; padding: 0 4px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <h1>SuperMensch online <span class="muted">(dev page: server test, the 3D board comes next)</span></h1>

  <section>
    <div class="row">I am <select id="me"></select> <span class="muted">this device</span></div>
  </section>

  <section id="lobby">
    <h2>Open games</h2>
    <div id="games" class="muted">…</div>
    <div class="row"><input id="joinId" placeholder="GameID, e.g. K7QX-42" size="16"><button id="joinBtn">Join</button></div>
  </section>

  <section id="create">
    <h2>New game</h2>
    <div class="row">Name <input id="gName" placeholder="Friday at grandma's" size="24"></div>
    <div class="row">
      Board <select id="gColors"><option value="6">6 colors</option><option value="4">4 colors</option></select>
      Game <select id="gMode"><option value="two">two colors each</option><option value="one">one color each</option></select>
      Dice <select id="gLevel"><option value="beginner">beginner</option><option value="advanced">advanced</option></select>
      Players <select id="gN"></select>
    </div>
    <div id="seats"></div>
    <div class="row"><button class="primary" id="createBtn">Create</button> <span id="createErr" class="err"></span></div>
  </section>

  <section id="game" hidden>
    <h2 id="gTitle"></h2>
    <div id="gSeats"></div>
    <div class="row"><a id="play3d" class="primary" href="#"><button class="primary">Play on the 3D board</button></a>
      <span class="muted">with the seats ticked above</span></div>
    <div id="gStatus" class="row"></div>
    <div id="gOpts" class="opts"></div>
    <div id="gLog" class="muted"></div>
    <div class="row"><button id="leaveBtn">Back to the lobby</button></div>
  </section>

  <section>
    <h2>Finished games</h2>
    <div id="history" class="muted">…</div>
  </section>

  <section>
    <h2>Admin</h2>
    <div class="row">Admin key <input id="adminKey" type="password" size="18"><button id="adminBtn">Open</button> <span id="adminErr" class="err"></span></div>
    <div id="admin"></div>
    <div id="adminGames"></div>
  </section>
</main>
<script type="module">
const $ = s => document.querySelector(s);
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* private mode */ } } };
const api = async (path, opts = {}) => {
  const r = await fetch("/api/" + path, { ...opts, headers: { "content-type": "application/json", ...(opts.headers || {}) } });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let users = [], ws = null, game = null, adminOk = false;

// games are made by the admin or by a user the admin gave the room-maker role
function showCreate() {
  const me = users.find(u => u.id === +$("#me").value);
  $("#create").hidden = !!game || !(adminOk || (me && me.canCreate));
}

async function loadUsers() {
  users = await api("users");
  const me = store.get("me") || "1";
  $("#me").innerHTML = users.map(u => `<option value="${u.id}" ${String(u.id) === me ? "selected" : ""}>${esc(u.name)}</option>`).join("");
  seatRows();
  showCreate();
}
$("#me").onchange = () => { store.set("me", $("#me").value); seatRows(); showCreate(); };

async function loadGames() {
  const gs = await api("games");
  $("#games").innerHTML = gs.length ? gs.map(g => `<div class="row"><b>${esc(g.name)}</b> <code>${g.id}</code>
    <span class="muted">${g.players.map(p => esc(p.name)).join(", ")}</span>
    <button data-join="${g.id}">Join</button></div>`).join("") : "No open games.";
  const hs = await api("history");
  $("#history").innerHTML = hs.length ? hs.map(h => `<div><b>${esc(h.name)}</b> <code>${h.id}</code> ·
    ${h.result.places.map((p, k) => `${k + 1}. ${esc(h.result.names[p])} (${h.result.scores[p]})`).join(" · ")}</div>`).join("") : "None yet.";
}
document.addEventListener("click", e => { const b = e.target.closest("[data-join]"); if (b) join(b.dataset.join); });
$("#joinBtn").onclick = () => join($("#joinId").value.trim().toUpperCase());

function seatRows() {
  const colors = +$("#gColors").value, two = $("#gMode").value === "two", max = two ? colors / 2 : colors;
  const n = Math.min(+$("#gN").value || 2, max);
  $("#gN").innerHTML = Array.from({ length: max - 1 }, (_, i) => `<option ${i + 2 === n ? "selected" : ""}>${i + 2}</option>`).join("");
  const opts = sel => users.map(u => `<option value="${u.id}" ${u.id === sel ? "selected" : ""}>${esc(u.name)}</option>`).join("") +
    `<option value="ai" ${sel === "ai" ? "selected" : ""}>Computer</option>`;
  const me = +$("#me").value;
  $("#seats").innerHTML = Array.from({ length: n }, (_, i) =>
    `<div class="row">Seat ${i + 1} <select data-seat="${i}">${opts(i === 0 ? me : "ai")}</select></div>`).join("");
}
for (const id of ["#gColors", "#gMode", "#gN"]) $(id).onchange = seatRows;

$("#createBtn").onclick = async () => {
  $("#createErr").textContent = "";
  const colors = +$("#gColors").value, mode = $("#gMode").value, half = colors / 2;
  const seats = [...document.querySelectorAll("[data-seat]")].map((s, i) => {
    const cols = mode === "two" ? [i, i + half] : [i];
    return s.value === "ai" ? { ai: true, colors: cols } : { user: +s.value, colors: cols };
  });
  try {
    const r = await api("games", { method: "POST", headers: adminOk ? { "x-admin-key": $("#adminKey").value } : {},
      body: JSON.stringify({ name: $("#gName").value, by: +$("#me").value, setup: { mode, colors, level: $("#gLevel").value, seats } }) });
    join(r.id);
  } catch (e) { $("#createErr").textContent = e.message; }
};

function join(id) {
  if (ws) ws.close();
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/api/games/${encodeURIComponent(id)}/ws`);
  ws.onopen = () => {
    const me = +$("#me").value;
    // first visit: the seats of the chosen user; later the seats ticked on this page
    ws.send(JSON.stringify({ t: "hello", device: users.find(u => u.id === me)?.name || "?", token: deviceToken(), seats: [] }));
    ws.pendingMe = me;
  };
  ws.onmessage = e => onMsg(JSON.parse(e.data));
  ws.onclose = () => { if (game) $("#gStatus").innerHTML += ` <span class="err">disconnected</span>`; };
  $("#lobby").hidden = $("#create").hidden = true;
  $("#game").hidden = false;
}

function claim(seats) { ws.send(JSON.stringify({ t: "hello", device: users.find(u => u.id === +$("#me").value)?.name || "?", token: deviceToken(), seats })); }

// the same random id the 3D game uses: a seat held here can be taken back by this browser only
function deviceToken() {
  try {
    let k = localStorage.getItem("supermensch-device");
    if (!k) { k = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("supermensch-device", k); }
    return k;
  } catch { return null; }
}

function onMsg(m) {
  if (m.t === "state") {
    const first = !game;
    game = { ...m, mine: m.mine || (game ? game.mine : []) };
    if (first && ws.pendingMe != null) {
      const mine = m.setup.players.map((p, i) => (p.user === ws.pendingMe ? i : -1)).filter(i => i >= 0);
      ws.pendingMe = null;
      if (mine.length) { game.mine = mine; claim(mine); }
    }
  } else if (m.t === "events") {
    if (m.from !== game.events.length) { claim(game.mine); return; }   // missed some: ask for the whole state
    game.events.push(...m.events); game.fp = m.fp; game.view = m.view;
  } else if (m.t === "seats") game.seats = m.seats;
  else if (m.t === "refused") { $("#gStatus").innerHTML += ` <span class="err">${esc(m.reason)}</span>`; return; }
  draw();
  if (m.t === "state" && m.taken && m.taken.length)        // a name in play on another device that has not left
    $("#gStatus").innerHTML += ` <span class="err">${m.taken.map(i => esc(m.setup.players[i].name)).join(", ")} is playing on another device (press Exit there first)</span>`;
}

function draw() {
  const g = game, v = g.view;
  $("#gTitle").innerHTML = `${esc(g.name)} <code>${g.id}</code>`;
  $("#gSeats").innerHTML = g.setup.players.map((p, i) => `<div class="row">
    ${p.isAi ? "" : `<input type="checkbox" data-mine="${i}" ${g.mine.includes(i) ? "checked" : ""}>`}
    Seat ${i + 1}: <b>${esc(p.name)}</b> <span class="muted">colors ${p.colors.join(", ")} · score ${v.scores[i]}
    ${p.isAi ? "· computer" : g.seats[i] ? `· on ${esc(g.seats[i])}` : "· nobody connected"}</span></div>`).join("");
  document.querySelectorAll("[data-mine]").forEach(c => c.onchange = () => {
    g.mine = [...document.querySelectorAll("[data-mine]:checked")].map(x => +x.dataset.mine);
    claim(g.mine);
  });
  $("#play3d").href = `/play?game=${g.id}&seats=${g.mine.join(",")}`;
  const d = v.pending;
  $("#gStatus").innerHTML = v.over ? `<b>Game over.</b> ${v.places.map((p, k) => `${k + 1}. ${esc(g.setup.players[p].name)}`).join(" · ")}`
    : `Round ${v.round} · <b>${esc(g.setup.players[d.player].name)}</b> ${d.kind}${d.dice.length ? ` · dice <b>${d.dice.join(" ")}</b>` : ""}
       <span class="muted">· ${g.events.length} events · ${g.fp}</span>`;
  const myTurn = d && g.mine.includes(d.player);
  $("#gOpts").innerHTML = d ? d.options.map((o, k) => `<button data-pick="${k}" ${myTurn ? "" : "disabled"}>${esc(o)}</button>`).join("") : "";
  document.querySelectorAll("[data-pick]").forEach(b => b.onclick = () =>
    ws.send(JSON.stringify({ t: "move", seq: g.events.length, ev: { pick: +b.dataset.pick } })));
  $("#gLog").innerHTML = v.log.map(esc).join("<br>");
}

$("#leaveBtn").onclick = () => { if (ws) ws.close(); ws = null; game = null;
  $("#game").hidden = true; $("#lobby").hidden = false; showCreate(); loadGames(); };

// every game, with a button to delete it (test rooms)
async function adminGames(key, list) {
  const gs = list || await api("admin/games", { method: "POST", body: "{}", headers: { "x-admin-key": key } });
  $("#adminGames").innerHTML = `<h2>All games</h2>` + (gs.length ? gs.map(g => `<div class="row"><b>${esc(g.name)}</b>
    <code>${g.id}</code> <span class="muted">${g.status} · ${new Date(g.updated).toLocaleString()}</span>
    <button data-del="${g.id}">Delete</button></div>`).join("") : `<div class="muted">No games.</div>`);
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Sure? Delete"; return; }   // a second press deletes
    try {
      const left = await api("admin/delete", { method: "POST", headers: { "x-admin-key": key }, body: JSON.stringify({ id: b.dataset.del }) });
      await adminGames(key, left);
      loadGames();
    } catch (e) { $("#adminErr").textContent = e.message; }
  });
}

$("#adminKey").value = store.get("adminKey") || "";
$("#adminBtn").onclick = async () => {
  $("#adminErr").textContent = "";
  const key = $("#adminKey").value;
  try { await api("admin/check", { method: "POST", body: "{}", headers: { "x-admin-key": key } }); }
  catch (e) { $("#adminErr").textContent = e.message; return; }
  store.set("adminKey", key);
  adminOk = true;
  showCreate();
  $("#admin").innerHTML = users.map(u => `<div class="row"><code>user ${u.id}</code>
    <input data-uid="${u.id}" value="${esc(u.name)}" size="20"><button data-ren="${u.id}">Rename</button>
    <label><input type="checkbox" data-role="${u.id}" ${u.canCreate ? "checked" : ""}> can make games</label></div>`).join("");
  await adminGames(key);
  document.querySelectorAll("[data-role]").forEach(c => c.onchange = async () => {
    try {
      await api("admin/role", { method: "POST", headers: { "x-admin-key": key },
        body: JSON.stringify({ id: +c.dataset.role, canCreate: c.checked }) });
      $("#adminErr").textContent = "";
      await loadUsers();
    } catch (e) { $("#adminErr").textContent = e.message; c.checked = !c.checked; }
  });
  document.querySelectorAll("[data-ren]").forEach(b => b.onclick = async () => {
    const id = +b.dataset.ren;
    try {
      await api("admin/rename", { method: "POST", headers: { "x-admin-key": key },
        body: JSON.stringify({ id, name: document.querySelector(`[data-uid="${id}"]`).value }) });
      $("#adminErr").textContent = "";
      await loadUsers();
    } catch (e) { $("#adminErr").textContent = e.message; }
  });
};

await loadUsers();
await loadGames();
const q = new URLSearchParams(location.search).get("game");
if (q) join(q.toUpperCase());
</script>
</body>
</html>
