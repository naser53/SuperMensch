name: Online server

# Deploys the online server (wrangler.toml) to Cloudflare from the main branch (since v2.1.0).
# Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and ADMIN_KEY (the key
# for renaming users on the page; any password the owner chooses). Voice chat (v3.0.0):
# REALTIME_APP_ID, REALTIME_APP_TOKEN, and optionally TURN_KEY_ID, TURN_KEY_TOKEN.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Build the game page
        run: npm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Admin key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          if [ -z "$ADMIN_KEY" ]; then echo "::warning::ADMIN_KEY is not set: renaming users stays off"; exit 0; fi
          printf '%s' "$ADMIN_KEY" | npx wrangler secret put ADMIN_KEY
      - name: Voice chat secrets (Cloudflare Realtime SFU and TURN; v3.0.0)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REALTIME_APP_ID: ${{ secrets.REALTIME_APP_ID }}
          REALTIME_APP_TOKEN: ${{ secrets.REALTIME_APP_TOKEN }}
          TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
          TURN_KEY_TOKEN: ${{ secrets.TURN_KEY_TOKEN }}
        run: |
          for k in REALTIME_APP_ID REALTIME_APP_TOKEN TURN_KEY_ID TURN_KEY_TOKEN; do
            v="${!k}"
            if [ -z "$v" ]; then echo "::warning::$k is not set: voice chat $( [ "${k#TURN}" = "$k" ] && echo stays off || echo works without TURN )"; continue; fi
            printf '%s' "$v" | npx wrangler secret put "$k"
          done
