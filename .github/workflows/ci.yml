name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Rule tests
        run: npm test
      - name: Computer-vs-computer games
        run: node tests/simulate.mjs 3
      - name: Build the single-file page
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: supermensch
          path: dist/supermensch.html
      - name: Publish to the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/supermensch.html \
            --title "SuperMensch (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download supermensch.html and open it in a modern browser — it works offline." \
            --prerelease
      - name: Publish a version release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          test "v$(node -p 'require("./package.json").version')" = "$TAG"
          awk -v h="## $TAG" 'index($0, h) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" dist/supermensch.html --title "SuperMensch $TAG" --notes-file notes.md --verify-tag
