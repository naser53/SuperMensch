name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Rule tests
        run: npm test
      - name: Computer-vs-computer games
        run: node tests/simulate.mjs 3
      - name: Build the game page
        run: npm run build
      # No game file in the releases since 2026-11-06 (owner): the game is played on the server only,
      # so its code is not handed out. A new version still gets a release with its notes.
      - name: Publish a version release (new version on main, or a pushed v* tag)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "$TAG" ]; then echo "tag is not $TAG"; exit 1; fi
          if gh release view "$TAG" > /dev/null 2>&1; then echo "$TAG already released"; exit 0; fi
          awk -v h="## $TAG" 'index($0, h) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$TAG" --title "SuperMensch $TAG" --notes-file notes.md --target "$GITHUB_SHA"
